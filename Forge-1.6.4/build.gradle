buildscript {
    repositories {
        mavenCentral()
        maven { url "https://maven.fabricmc.net" }
        maven { url "https://repo.sleeping.town" }
    }
    dependencies {
        classpath "agency.highlysuspect:voldeloom:2.4"
    }
}

apply plugin: "java"
apply plugin: "agency.highlysuspect.voldeloom"

archivesBaseName = "${rootProject.name}-forge-1.6.4"

ext.gimmeJava(6)

String minecraftVersion = "1.6.4"
String forgeVersion = "1.6.4-9.11.1.1345"

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    forge "net.minecraftforge:forge:${forgeVersion}:universal@jar"
    mappings "net.minecraftforge:forge:${forgeVersion}:src@zip"

    implementation project(":Core")
}

//fold in Core resources and sources
processResources {
    from project(":Core").sourceSets.main.resources
}

tasks.withType(JavaCompile) {
    source(project(":Core").sourceSets.main.allSource)
}

jar {
    manifest {
        attributes(
            "FMLCorePlugin": "classic_utilities.forge.asm.EndermanCorePlugin",
            "FMLCorePluginContainsFMLMod": "true"
        )
    }
}

tasks.withType(JavaExec).configureEach {
    jvmArgs "-Dfml.coreMods.load=classic_utilities.forge.asm.EndermanCorePlugin"
}
